# Only overrides live here; see `lazygit --config` for the full defaults.
gui:
  # Catppuccin Mocha
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'
  authorColors:
    '*': '#b4befe'
  skipStashWarning: true
  showFileTree: false # flat file list instead of a tree
keybinding:
  universal:
    optionMenu: ['x', '?'] # help/keybindings menu on both keys
    suspendApp: <disabled> # frees <ctrl+z> (the default suspend key) for redo
    redo: <ctrl+z>
  commits:
    cherryPickCopy: c
    setFixupMessage: C # default `c` is taken by cherryPickCopy
    pasteCommits: v
