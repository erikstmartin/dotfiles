# -- general -------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -g default-shell "$SHELL"   # tmux starts it as a login shell

# usstyle: WezTerm reports TERM=xterm-256color, whose terminfo lacks Smulx (undercurl)
set -as terminal-features ',*:RGB'
set -as terminal-features ',xterm*:usstyle:extkeys'
set -as terminal-features ',tmux*:extkeys'

set -s escape-time 0                      # faster command sequences
set -g repeat-time 400                    # window for repeating `bind -r` keys
set -s focus-events on

# Extended keys (shift+enter, ctrl+i, ...) in CSI-u format, sent only when the app requests them
set -s extended-keys on
set -s extended-keys-format csi-u
set -g allow-passthrough on

set -g history-limit 50000                 # boost history

# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# vi keys in copy mode
setw -g mode-keys vi
set -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Copy mode / choose-tree colours (Catppuccin Mocha)
set -g mode-style "fg=#cdd6f4,bg=#45475a"
set -g copy-mode-match-style "fg=#11111b,bg=#f9e2af"
set -g copy-mode-current-match-style "fg=#11111b,bg=#fab387"

setw -g aggressive-resize on

bind C-q confirm-before -p "kill-session #S? (y/n)" kill-session
bind x kill-pane                                    # kill pane without confirmation
bind X kill-window                                  # kill window without confirmation
bind-key C-c command-prompt -p "Session name:" "new-session -d -s '%%' \; switch-client -t '%%'"
bind-key C-r command-prompt -p "Rename session:" "rename-session '%%'"
bind-key r command-prompt -p "Rename window:" "rename-window '%%'"

# session navigation (Shift-Tab)
bind BTab switch-client -l  # move to last session

# Native tmux choosers with search support (press '/' to filter)
bind s choose-tree -Zs
bind w choose-tree -Zw

# reload configuration
set-environment -g TMUX_PROGRAM "tmux"
set-environment -g TMUX_CONF "~/.tmux.conf"
run '"$TMUX_PROGRAM" -S #{socket_path} set-environment -g TMUX_SOCKET "#{socket_path}"'
bind M-r run '"$TMUX_PROGRAM" ${TMUX_SOCKET:+-S "$TMUX_SOCKET"} source "$TMUX_CONF"' \; display "#{TMUX_CONF} sourced"

# -- display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename off  # do not rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set-hook -g after-rename-window 'run-shell "~/.local/bin/rename-with-icon.sh \"#{window_name}\" \"#{window_id}\""'

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 4000      # slightly longer status messages display time

set -g status-interval 5      # redraw status line every 5 seconds

# clear both screen and history
#bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# activity
set -g monitor-activity on
set -g visual-activity off


# -- navigation ----------------------------------------------------------------

# split current window horizontally
bind - split-window -v
# split current window vertically
bind \\ split-window -h

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
unbind Left
unbind Down
unbind Up
unbind Right
unbind C-Up   
unbind C-Down 
unbind C-Left 
unbind C-Right

bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
bind -r n next-window       # select next window
bind -r p previous-window   # select previous window
bind Tab last-window        # move to last active window
bind -r C-h swap-window -t -1 \; select-window -t -1  # move window left
bind -r C-l swap-window -t +1 \; select-window -t +1  # move window right

# toggle mouse
set -g mouse on
# bind m run "cut -c3- '#{TMUX_CONF}' | sh -s _toggle_mouse"

# Zoom toggle
bind z resize-pane -Z
bind Enter resize-pane -Z

# -- buffers -------------------------------------------------------------------

# list paste buffers: prefix + # (tmux default)
bind C-p paste-buffer -p # paste from the top paste buffer
bind C-P choose-buffer   # choose which buffer to paste from
# paste from the system clipboard (macOS / Wayland / X11 / WSL)
bind v run-shell '{ \
  if command -v pbpaste >/dev/null 2>&1; then pbpaste; \
  elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-paste >/dev/null 2>&1; then wl-paste --no-newline; \
  elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -o; \
  elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --output; \
  elif command -v win32yank.exe >/dev/null 2>&1; then win32yank.exe -o --lf; \
  elif command -v powershell.exe >/dev/null 2>&1; then powershell.exe -NoProfile -Command Get-Clipboard | tr -d "\r"; \
  fi; } | tmux load-buffer - && tmux paste-buffer -d -p'


# -- popup windows -------------------------------------------------------------
bind Space display-menu -T "Launcher" \
  "Lazygit"     g "display-popup -d '#{pane_current_path}' -w 80% -h 80% -E '#{default-shell} -ilc lazygit'" \
  "Lazydocker"  d "display-popup -d '#{pane_current_path}' -w 80% -h 80% -E '#{default-shell} -ilc lazydocker'" \
  "K9s"         k "display-popup -d '#{pane_current_path}' -w 80% -h 80% -E '#{default-shell} -ilc k9s'" \
  "gh-dash"     h "display-popup -d '#{pane_current_path}' -w 90% -h 90% -E '#{default-shell} -ilc gh\\ dash'" \
  "Obsidian"    o "display-popup -d '#{pane_current_path}' -w 90% -h 90% -E '#{default-shell} -ilc \"nvim \\\"`printenv OBSIDIAN_VAULT`\\\"\"'" \
  "AI Assistant" a "display-popup -d '#{pane_current_path}' -w 90% -h 90% -E '#{default-shell} -ilc ai'" \
  "Terminal"    t "display-popup -d '#{pane_current_path}' -w 75% -h 75% -E '#{default-shell}'" \
   "" \
   "Config"      c "display-popup -d '#{pane_current_path}' -w 90% -h 90% -E '#{default-shell} -ilc \"nvim ~/dotfiles\"'"

# Session management menu
bind S display-menu -T "Session Management" \
  "New Session"     c "command-prompt -p 'Session name:' 'new-session -d -s \"%%\" ; switch-client -t \"%%\"'" \
  "Rename Session"  r "command-prompt -p 'Rename session:' 'rename-session \"%%\"'" \
  "Kill Session"    q "confirm-before -p 'kill-session #S? (y/n)' kill-session" \
  "" \
  "Switch Session"  s "choose-session" \
  "Detach"          d "detach-client"

# Window management menu  
bind W display-menu -T "Window Management" \
  "New Window"      n "new-window -c '#{pane_current_path}'" \
  "Rename Window"   r "command-prompt -p 'Rename window:' 'rename-window \"%%\"'" \
  "Kill Window"     k "confirm-before -p 'kill-window #W? (y/n)' kill-window" \
  "" \
  "Split Vertical"   v "split-window -h -c '#{pane_current_path}'" \
  "Split Horizontal" s "split-window -v -c '#{pane_current_path}'" \
  "" \
  "Move Left"        h "swap-window -t -1" \
  "Move Right"       l "swap-window -t +1" \
  "" \
  "Choose Window"    w "choose-window"

# Pane management menu
bind P display-menu -T "Pane Management" \
  "Split Vertical"   v "split-window -h -c '#{pane_current_path}'" \
  "Split Horizontal" s "split-window -v -c '#{pane_current_path}'" \
  "" \
  "Kill Pane"        x "confirm-before -p 'kill-pane? (y/n)' kill-pane" \
  "Break Pane"       b "break-pane" \
  "" \
  "Swap Up"          k "swap-pane -U" \
  "Swap Down"        j "swap-pane -D" \
  "Swap Left"        h "swap-pane -L" \
  "Swap Right"       l "swap-pane -R" \
  "" \
  "Zoom"             z "resize-pane -Z" \
  "Mark"             m "select-pane -m"

# -- workmux -------------------------------------------------------------------

# Dashboard: TUI overview of all agents/worktrees, opened as a popup
bind A display-popup -h 30 -w 100 -E "workmux dashboard"

# Sidebar: always-visible agent panel pinned to the window edge
bind C-t run-shell "workmux sidebar"

# Cycle agents without the prefix key
# (passed through to Neovim, which uses Alt-j/k to resize windows)
bind -n M-j if -F '#{==:#{pane_current_command},nvim}' 'send-keys M-j' 'run-shell "workmux sidebar next"'
bind -n M-k if -F '#{==:#{pane_current_command},nvim}' 'send-keys M-k' 'run-shell "workmux sidebar prev"'

# Jump directly to agent 1-9 without the prefix key
bind -n M-1 run-shell "workmux sidebar jump 1"
bind -n M-2 run-shell "workmux sidebar jump 2"
bind -n M-3 run-shell "workmux sidebar jump 3"
bind -n M-4 run-shell "workmux sidebar jump 4"
bind -n M-5 run-shell "workmux sidebar jump 5"
bind -n M-6 run-shell "workmux sidebar jump 6"
bind -n M-7 run-shell "workmux sidebar jump 7"
bind -n M-8 run-shell "workmux sidebar jump 8"
bind -n M-9 run-shell "workmux sidebar jump 9"

# Jump to the agent that most recently finished or is waiting for input;
# repeat to cycle through completed/waiting agents (most recent first)
bind a run-shell "workmux last-done"

# Toggle between current and last-visited agent (mirrors dashboard's Bksp)
bind BSpace run-shell "workmux last-agent"

# -- plugins -------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
run '~/.tmux/plugins/tpm/tpm'

# ---------------------------------------------------------------------------
# Status bar (Catppuccin Mocha colours)
# ---------------------------------------------------------------------------

# -- Pane borders ------------------------------------------------------------
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'
set -g status-style 'bg=#11111b'
set -g status-left-length 200
set -g status-right-length 300
set -g status-position top
# -- Messages ---------------------------------------------------------------
set -g message-style 'fg=#cdd6f4,bg=#313244'
set -g message-command-style 'fg=#cdd6f4,bg=#313244'
# -- Popups and menus -------------------------------------------------------
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#89b4fa'
set -g menu-border-lines rounded
set -g menu-border-style 'fg=#89b4fa'
set -g menu-style 'fg=#cdd6f4,bg=#11111b'
set -g menu-selected-style 'fg=#11111b,bg=#89b4fa'

set -g status-left "\
#[fg=#181825,bg=#{?#{==:#{client_key_table},prefix},#f9e2af,#{?#{pane_in_mode},#a6e3a1,#89dceb}},bold] #{?#{==:#{client_key_table},prefix},PREFIX,#{?#{pane_in_mode},COPY,NORMAL}} \
#[fg=#{?#{==:#{client_key_table},prefix},#f9e2af,#{?#{pane_in_mode},#a6e3a1,#89dceb}},bg=#89b4fa]\
#[fg=#181825,bg=#89b4fa]  #S \
#[fg=#89b4fa,bg=#11111b]\
 "

set -g window-status-separator ''
# Activity/bell: yellow/red window names instead of tmux's inverted style
set -g window-status-activity-style none
set -g window-status-bell-style none
set -g window-status-format "#[fg=#{?window_bell_flag,#f38ba8,#{?window_activity_flag,#f9e2af,#6c7086}},bg=#11111b] #I: #W#{?@workmux_status, #{@workmux_status},} #[fg=#45475a,bg=#11111b]|"
set -g window-status-current-format "#[fg=#181825,bg=#89dceb] #I #[fg=#cdd6f4,bg=#11111b] #W#{?@workmux_status, #{@workmux_status},} #[fg=#45475a,bg=#11111b]|"

set -g @show_sys_stats 1

bind M if-shell '[ -n "$(tmux show-option -gqv @show_sys_stats)" ]' \
  'set -g @show_sys_stats "" ; display "sys stats: hidden"' \
  'set -g @show_sys_stats 1  ; display "sys stats: visible"'

set -g status-right "\
#{?#{@show_sys_stats},#[fg=#cdd6f4,bg=#11111b]  #(~/.local/bin/tmux-mem.sh)   #(~/.local/bin/tmux-cpu.sh) ,}\
#[bg=#11111b]#[fg=#89b4fa]#[fg=#181825,bg=#89b4fa]  #{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}} \
#[fg=#89dceb,bg=#89b4fa]#[fg=#181825,bg=#89dceb,bold]  #h \
"
