#:schema https://yazi-rs.github.io/schemas/yazi.json

# Only overrides; see yazi-config/preset/yazi-default.toml for defaults

[mgr]
# No "drag" (the default also includes it)
mouse_events = ["click", "scroll"]

[opener]
jqp = [
  { run = "jqp -f %s1", block = true, desc = "Explore with jqp" },
]
play = [
  { run = "xdg-open %s1", desc = "Play", for = "linux", orphan = true },
  { run = "open %s", desc = "Play", for = "macos" },
  { run = 'start "" %s1', desc = "Play", for = "windows", orphan = true },
]

[open]
prepend_rules = [
  { url = "*.{json,jsonl,ndjson}", use = [ "edit", "jqp", "reveal" ] },
  { mime = "application/{json,ndjson}", use = [ "edit", "jqp", "reveal" ] },
]

[plugin]
# CSV / TSV via plugins/csv.yazi (miller table, falls back to code)
prepend_spotters = [
  { mime = "text/csv", run = "csv" },
  { mime = "text/tab-separated-values", run = "csv" },
  { url = "*.csv", run = "csv" },
  { url = "*.tsv", run = "csv" },
]
prepend_previewers = [
  { mime = "text/csv", run = "csv" },
  { mime = "text/tab-separated-values", run = "csv" },
  { url = "*.csv", run = "csv" },
  { url = "*.tsv", run = "csv" },
]
