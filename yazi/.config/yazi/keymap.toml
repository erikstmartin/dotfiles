#:schema https://yazi-rs.github.io/schemas/keymap.json

# Only custom keys live here; prepend_keymap takes priority over yazi's
# built-in defaults (yazi-config/preset/keymap-default.toml).

[mgr]
prepend_keymap = [
  # Goto
  { on = [ "g", "C" ], run = "cd ~/Code", desc = "Go ~/Code" },

  # Tabs (single key; shadows the default t-prefixed tab keys)
  { on = "t", run = "tab_create --current", desc = "Create a new tab with CWD" },
  # ...so tab rename (default `t r`) moves to T
  { on = "T", run = "tab_rename --interactive", desc = "Rename current tab" },
]
